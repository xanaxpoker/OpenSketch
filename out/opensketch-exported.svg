            <text id="This quick guide wil" font-family="AvenirNext-Regular" font-size="15" fill="#000000" x="20" y="293">This quick guide will give you an introduction to Sketch’s Smart Layout feature, which lets you create dynamic Symbols that expand when you edit their content.

Once you’ve set up Smart Layout, changing an override in a Symbol’s instance will resize it automatically.

Edit this button text override to see Smart Layout in action:</text>
            <text id="Pretty cool, right?" font-family="AvenirNext-Regular" font-size="15" fill="#000000" x="20" y="644">Pretty cool, right? Smart Layout maintains the padding and spacing between layers in a Symbol when an override changes its size.</text>
